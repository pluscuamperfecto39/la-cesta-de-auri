name: Validar aplicación iPhone

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar para simulador
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Compilar La Cesta de Auri
        run: >-
          xcodebuild
          -project ios/LaCestaDeAuri.xcodeproj
          -scheme LaCestaDeAuri
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
